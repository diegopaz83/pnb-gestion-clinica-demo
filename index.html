<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Consultorio María Isabel Ríos · PNB Digital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: demo bar sticky arriba; tres mundos (sitio editorial, consola con sidebar, portal paciente con tab bar inferior) sobre un sistema de tokens común */
/* Layout: barra PNB navy arriba; consola y portal con sistema PNB Digital (navy + dorado sobre paper, Inter); sitio de la doctora con acento propio configurable */
:root{
  --pnb-navy-900:#081120; --pnb-navy-800:#0d1b33; --pnb-navy-700:#132647; --pnb-navy-600:#172b4d; --pnb-navy-500:#2c4673; --pnb-navy-400:#5b7096; --pnb-navy-300:#8d9db8; --pnb-navy-200:#c4cddb; --pnb-navy-100:#e4e9f1; --pnb-navy-50:#f1f4f8;
  --pnb-gold-800:#6b540b; --pnb-gold-700:#8a6d0f; --pnb-gold-600:#a8861a; --pnb-gold-500:#c9a227; --pnb-gold-400:#d4af37; --pnb-gold-300:#e5c358; --pnb-gold-200:#f0dc9a; --pnb-gold-100:#f8efcc; --pnb-gold-50:#fcf8e8;
  --pnb-paper:#f8f9fa; --pnb-white:#ffffff; --pnb-line:#dde3ec; --pnb-line-soft:#e8ecf2; --pnb-line-strong:#b9c4d4;
  --pnb-fg-1:#0d1b33; --pnb-fg-2:#3b4d66; --pnb-fg-3:#5a6b84; --pnb-on-dark-1:#f2f6fb; --pnb-on-dark-2:#b9c6da; --pnb-on-dark-3:#8496b1;
  --pnb-success-600:#17785a; --pnb-success-100:#d3f1e5; --pnb-warning-600:#b4570f; --pnb-warning-100:#fbe3c8; --pnb-danger-600:#b3321f; --pnb-danger-100:#f7d6d0; --pnb-info-600:#2a63a8; --pnb-info-100:#d6e5f6; --pnb-info-50:#eef5fc;
  --pnb-shadow-sm:0 4px 14px -4px rgba(13,27,51,.10); --pnb-shadow-md:0 12px 30px -8px rgba(13,27,51,.16); --pnb-shadow-lg:0 24px 48px -12px rgba(13,27,51,.24); --pnb-shadow-gold:0 8px 24px -6px rgba(201,162,39,.5);
  --pnb-ease:cubic-bezier(.2,.7,.2,1);
  /* alias usados por los componentes */
  --bg:var(--pnb-paper); --surface:var(--pnb-white); --surface-2:var(--pnb-navy-50); --surface-3:var(--pnb-navy-100);
  --ink:var(--pnb-fg-1); --ink-2:var(--pnb-fg-2); --ink-3:var(--pnb-fg-3); --line:var(--pnb-line);
  --pine:var(--pnb-navy-800); --pine-2:var(--pnb-navy-600); --pine-soft:var(--pnb-navy-50); --on-pine:var(--pnb-on-dark-1);
  --saffron:var(--pnb-gold-500); --saffron-2:var(--pnb-gold-700); --saffron-soft:var(--pnb-gold-50);
  --sky:var(--pnb-info-600); --sky-soft:var(--pnb-info-100);
  --ok:var(--pnb-success-600); --ok-soft:var(--pnb-success-100); --warn:var(--pnb-warning-600); --warn-soft:var(--pnb-warning-100); --bad:var(--pnb-danger-600); --bad-soft:var(--pnb-danger-100);
  --shadow:var(--pnb-shadow-sm);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --r:24px; --r-sm:16px;
  --site-accent:#1C5747; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
h1,h2,.display{font-family:var(--f-display);font-weight:800;letter-spacing:-.025em}
p{margin:0}
a{color:var(--pine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pnb-gold-500);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pnb-gold-700)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.grid>*{min-width:0}

/* Demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--pnb-navy-900);color:var(--pnb-on-dark-1)}
.demobar .pnb-logo{width:120px;height:auto;display:block;margin-block:-4px}
.demobar .brand small{font-weight:500;color:var(--pnb-on-dark-3);font-size:12px}
.demobar .dbin{display:flex;align-items:center;gap:10px;min-height:48px;flex-wrap:wrap;padding-block:6px}
.demobar .brand{font-weight:800;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.demobar .brand i{font-style:normal;font-weight:600;opacity:.6}
.tag-demo{font-family:var(--f-body);font-size:10.5px;padding:3px 9px;border-radius:999px;background:var(--pnb-gold-500);color:var(--pnb-navy-800);font-weight:700;font-weight:500;letter-spacing:.04em;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:0;background:transparent;color:inherit;opacity:.72;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .14s var(--pnb-ease)}
.seg button[aria-current="true"]{background:var(--pnb-gold-500);color:var(--pnb-navy-800);opacity:1}
.demobar .ghost{border:1px solid rgba(242,246,251,.35);background:transparent;color:inherit;border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.demobar .ghost:hover{background:rgba(255,255,255,.08)}
.demobar .xbtn{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1}
.only-sm{display:none}
.demo-fab{position:fixed;z-index:70;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));border:1px solid rgba(201,162,39,.5);background:var(--pnb-navy-800);color:var(--pnb-gold-500);font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;opacity:.55;cursor:pointer;box-shadow:var(--pnb-shadow-sm);transition:opacity .14s var(--pnb-ease)}
.demo-fab:hover,.demo-fab:focus-visible{opacity:1}
@media (max-width:820px){.demo-fab.over-tab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media (max-width:760px){.demobar .dbin{gap:6px;min-height:0;padding-block:8px}.demobar .brand{flex:1;min-width:0}.demobar .brand i,.demobar .tag-demo{display:none}.demobar .ghost{padding:5px 10px;font-size:12px}.demobar .xbtn{padding:0}.only-sm{display:inline}.hide-sm{display:none!important}.seg{margin-left:0;order:3;width:100%}.seg button{flex:1;padding:7px 4px;font-size:12.5px}}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .14s var(--pnb-ease),border-color .14s var(--pnb-ease),box-shadow .14s var(--pnb-ease),transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary,.btn.accent{background:var(--pnb-gold-500);color:var(--pnb-navy-800);box-shadow:var(--pnb-shadow-gold)}
.btn.primary:hover,.btn.accent:hover{background:var(--pnb-gold-400)}
.btn.primary:active,.btn.accent:active{background:var(--pnb-gold-600)}
.btn.line{background:transparent;border-color:var(--pnb-navy-800);color:var(--pnb-navy-800)}
.btn.line:hover{background:var(--pnb-navy-50)}
.btn.dark{background:var(--pnb-navy-800);color:var(--pnb-on-dark-1)}
.btn.dark:hover{background:var(--pnb-navy-600)}
.btn.outline-light{background:transparent;border-color:rgba(242,246,251,.5);color:var(--pnb-on-dark-1)}
.btn.outline-light:hover{background:rgba(242,246,251,.08)}
.btn.quiet{background:transparent;color:var(--ink-2);padding:7px 10px}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--pnb-danger-600);color:#fff}
.btn.danger:hover{background:#9a2a1a}
.btn.sm{padding:6px 13px;font-size:13px;box-shadow:none}
.btn.xs{padding:3px 10px;font-size:12px;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:650;color:var(--ink-2);min-width:0}
.in,select.in,textarea.in{width:100%;background:var(--surface);border:1px solid var(--pnb-line-strong);border-radius:12px;padding:9px 11px;font-size:14px;font-weight:450;color:var(--ink);min-width:0}
textarea.in{resize:vertical;min-height:80px;line-height:1.5}
.in:hover{border-color:var(--pnb-navy-400)}
.in:focus{border-color:var(--pnb-gold-500);outline:none;box-shadow:0 0 0 3px var(--pnb-gold-100)}
.in::placeholder{color:var(--pnb-navy-300)}
.in.sm{padding:6px 9px;font-size:13px;border-radius:10px}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.hint{font-size:12.5px;color:var(--ink-3);font-weight:450}

/* Cards, chips */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--pnb-shadow-sm)}
.card.flat{box-shadow:none;background:var(--pnb-navy-50);border-color:transparent}
.card.raised{box-shadow:var(--pnb-shadow-md)}
.card.dark{background:var(--pnb-navy-800);color:var(--pnb-on-dark-1);border-color:rgba(201,162,39,.35)}
.card h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.st-solicitada{background:var(--warn-soft);color:var(--warn)}
.st-confirmada{background:var(--sky-soft);color:var(--sky)}
.st-completada{background:var(--ok-soft);color:var(--ok)}
.st-cancelada{background:var(--bad-soft);color:var(--bad)}
.st-publicado{background:var(--ok-soft);color:var(--ok)}
.st-borrador{background:var(--warn-soft);color:var(--warn)}
.st-reemplazado{background:var(--surface-2);color:var(--ink-3)}
.st-pagado{background:var(--ok-soft);color:var(--ok)}
.st-pendiente{background:var(--warn-soft);color:var(--warn)}
.st-revisado{background:var(--ok-soft);color:var(--ok)}
.st-revision{background:var(--warn-soft);color:var(--warn)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--on-pine);background:var(--pine)}
.avatar.lg{width:56px;height:56px;font-size:19px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-body);font-size:36px;line-height:1.05;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--pnb-navy-800)}
.kpi .l{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.kpi .s{font-size:12px;color:var(--ink-3)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-size:15px}
.note-demo{display:block;background:var(--pnb-gold-50);border:1px solid var(--pnb-gold-200);color:var(--ink-2);border-radius:var(--r-sm);padding:10px 14px;font-size:13px}
.note-demo b{color:var(--pnb-gold-800)}
.divider{height:1px;background:var(--line);border:0;margin:6px 0}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:left;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--pnb-line-soft);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--pnb-gold-50)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .in.sm{min-width:70px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:650;font-size:13.5px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--pnb-navy-800);border-bottom-color:var(--pnb-gold-500)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--pnb-line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.pills button[aria-pressed="true"]{background:var(--pnb-navy-800);color:var(--pnb-on-dark-1);border-color:var(--pnb-navy-800)}

/* Modal & toast */
.scrim{position:fixed;inset:0;background:rgba(6,14,11,.5);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:24px;width:100%;max-width:640px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:rise .2s ease;margin:auto 0}
.modal.wide{max-width:980px}
.modal.xl{max-width:1100px}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:999px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-2);flex:none}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--pnb-navy-800);color:var(--pnb-on-dark-1);padding:11px 16px;border-radius:16px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:rise .2s ease;display:flex;gap:10px;align-items:center}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--pnb-warning-600);flex:none}
.toast.ok i{background:var(--pnb-gold-500)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ PUBLIC SITE (identidad de la doctora) ============ */
.site,.site-scope{--pine:var(--site-accent);--pine-2:color-mix(in srgb,var(--site-accent) 80%,black);--pine-soft:color-mix(in srgb,var(--site-accent) 10%,white);--on-pine:#fff}
.site .eyebrow,.site-scope .eyebrow{color:var(--site-accent)}
.site .btn.primary,.site-scope .btn.primary{background:var(--site-accent);color:#fff;box-shadow:none}
.site .btn.primary:hover,.site-scope .btn.primary:hover{background:var(--pine-2)}
.site .btn.line,.site-scope .btn.line{border-color:var(--site-accent);color:var(--site-accent)}
.site .btn.line:hover,.site-scope .btn.line:hover{background:var(--pine-soft)}
.site h1,.site h2{font-weight:700;letter-spacing:-.025em}
.portrait .ph-slot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.85);text-align:center;padding:24px}
.portrait .mono-v{width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:46px;font-weight:300;letter-spacing:-.02em;color:#fff}
.portrait .ph-slot small{font-size:12.5px;max-width:28ch}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--pnb-gold-500)}
.site{background:var(--bg)}
.site-nav{display:flex;align-items:center;gap:18px;padding-block:18px;flex-wrap:wrap}
.site-nav .logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;color:var(--ink);text-decoration:none}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--pine);display:grid;place-items:center;color:var(--on-pine);font-family:var(--f-display);font-size:17px}
.site-nav nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.site-nav nav a{color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;padding:7px 10px;border-radius:8px}
.site-nav nav a:hover{background:var(--surface-2);color:var(--ink)}
@media (max-width:760px){.site-nav nav{display:none}}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:32px 56px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(36px,5.4vw,62px);line-height:1.02}
.hero h1 em{font-style:normal;color:var(--pine)}
.hero .lead{font-size:18px;color:var(--ink-2);max-width:54ch;margin-top:18px}
.hero .cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.hero .facts{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font-family:var(--f-display);font-size:26px;font-weight:400}
.hero .facts span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.portrait{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:28px;overflow:hidden;background:var(--pine)}
.portrait svg{width:100%;height:100%;display:block}
.portrait .badge{position:absolute;left:16px;bottom:16px;right:16px;background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.portrait .badge b{display:block;font-size:14px}
.portrait .badge span{font-size:12.5px;color:var(--ink-2)}
.band{padding-block:64px}
.band.alt{background:var(--surface)}
.band.ink{background:var(--pine);color:var(--on-pine)}
.band.ink .muted{color:inherit;opacity:.8}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(28px,3.6vw,40px)}
.sec-h p{max-width:52ch;color:var(--ink-2)}
.svc{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.band.alt .svc{background:var(--bg)}
.svc:hover{border-color:var(--pine);transform:translateY(-2px)}
.svc h3{font-size:18px;font-weight:750;line-height:1.25}
.svc .meta{display:flex;gap:14px;font-size:13px;color:var(--ink-2);font-weight:600;flex-wrap:wrap}
.svc .price{font-family:var(--f-display);font-size:22px;margin-top:auto}
.method{counter-reset:m;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.method{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.method{grid-template-columns:1fr}}
.method li{list-style:none;padding:20px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.method li::before{counter-increment:m;content:"Paso " counter(m);font-family:var(--f-mono);font-size:11.5px;opacity:.75;display:block;margin-bottom:10px}
.method b{display:block;font-size:16px;margin-bottom:6px}
.method span{font-size:13.5px;opacity:.82}
.quote{padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.quote p{font-family:var(--f-display);font-size:17px;line-height:1.45}
.quote .who{display:flex;gap:10px;align-items:center;font-size:13px}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:15.5px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-3)}
.faq details[open] summary::after{content:"–"}
.faq p{margin-top:8px;color:var(--ink-2);max-width:70ch}
.contact-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.contact-line span{color:var(--ink-3);font-size:12.5px;font-weight:700;width:90px;text-transform:uppercase;letter-spacing:.06em}
.contact-line b{font-weight:600;user-select:all;overflow-wrap:anywhere}
.site-foot{padding-block:28px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.hl-row{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 28px;scrollbar-width:none}
.hlc{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;width:84px}
.hlc i{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);padding:4px;display:block;transition:border-color .14s var(--pnb-ease)}
.hlc i span{width:100%;height:100%;border-radius:50%;background:var(--site-accent);color:#fff;display:grid;place-items:center}
.hlc b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.hlc:hover i{border-color:var(--site-accent)}
.svc.plan .feat{margin:4px 0 8px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.svc.plan .feat li{padding-left:20px;position:relative}
.svc.plan .feat li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:5px;border-left:2px solid var(--site-accent);border-bottom:2px solid var(--site-accent);transform:rotate(-45deg)}
.svc.featured{border:2px solid var(--site-accent)}
.case{display:flex;flex-direction:column;gap:10px}
.case-ph{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.case-img{position:relative;border-radius:20px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/5;max-width:100%}
.case-img img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.case-img .lb{position:absolute;top:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(13,27,51,.78);color:#fff;padding:3px 9px;border-radius:999px}
.case-img .l{left:10px}.case-img .r{right:10px}
.case figcaption small{font-size:11.5px;color:var(--ink-3)}
.case figcaption{display:flex;flex-direction:column;font-size:13.5px}
.case figcaption span{color:var(--ink-3)}
.chk-photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.chk-photos{grid-template-columns:repeat(2,minmax(0,1fr))}.hl-row{gap:12px}.hlc{width:72px}.hlc i{width:64px;height:64px}.hlc b{font-size:12px}}
.chk-slot{border:1.5px dashed var(--pnb-line-strong);border-radius:16px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;font-size:12px;color:var(--ink-3)}
.chk-slot b{color:var(--ink);font-size:12.5px}
.cam-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.meas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.meas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meas small{font-weight:450;color:var(--ink-3);font-size:11.5px;line-height:1.35}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-h i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--pnb-navy-800);color:var(--pnb-gold-500);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.step-h b{font-size:15px}
.cond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13.5px}
@media (max-width:620px){.cond{grid-template-columns:1fr}}
.cond label{display:flex;gap:8px;align-items:center}
/* Booking */
.steps{display:flex;gap:6px;margin-bottom:4px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface-3)}
.steps i.on{background:var(--pine)}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1.5px solid var(--line);border-radius:11px;padding:8px 2px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:1px}
.day small{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.day b{font-size:17px}
.day[aria-pressed="true"]{border-color:var(--pine);background:var(--pine);color:var(--on-pine)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.day[disabled]{opacity:.35;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;cursor:pointer;font-family:var(--f-mono);font-size:13.5px;background:var(--surface)}
.slot[aria-pressed="true"]{border-color:var(--pine);background:var(--pine);color:var(--on-pine)}
.slot[disabled]{text-decoration:line-through;opacity:.4;pointer-events:none}
.confirm-card{border-radius:16px;background:var(--pine-soft);padding:20px;display:flex;flex-direction:column;gap:6px}

/* ============ PRO CONSOLE ============ */
.pro{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 48px)}
.side{background:var(--pnb-navy-800);color:var(--pnb-on-dark-2);border-right:0;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(48px + env(safe-area-inset-top,0px));height:calc(100vh - 48px - env(safe-area-inset-top,0px));overflow-y:auto}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid rgba(242,246,251,.1);margin-bottom:8px}
.side .who b{color:var(--pnb-on-dark-1)}
.side .who b{font-size:13.5px;display:block;line-height:1.2}
.side .who span{font-size:12px;color:var(--pnb-on-dark-3)}
.nav-i{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:999px;font-weight:500;font-size:14px;color:var(--pnb-on-dark-2);cursor:pointer;text-align:left;width:100%}
.nav-i:hover{background:rgba(242,246,251,.06);color:var(--pnb-on-dark-1)}
.nav-i[aria-current="true"]{background:rgba(201,162,39,.14);color:var(--pnb-gold-500);font-weight:700}
.nav-i svg{width:18px;height:18px;flex:none}
.nav-i .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--pnb-gold-500);color:var(--pnb-navy-800);border-radius:99px;padding:1px 7px}
.side .grp{color:var(--pnb-on-dark-3)!important;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:750;padding:14px 10px 4px}
.main{padding-block:24px 60px;min-width:0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:32px}
.page-h p{color:var(--ink-2);margin-top:4px}
@media (max-width:900px){
  .pro{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .pro-tabbar{display:grid}
}
.pro-tabbar{display:none;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--pnb-navy-800);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.pro-tabbar button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--pnb-on-dark-2);padding:6px 0;border-radius:12px;cursor:pointer}
.pro-tabbar button svg{width:21px;height:21px}
.pro-tabbar button[aria-current="true"]{color:var(--pnb-gold-500);background:rgba(201,162,39,.14)}
.pro-tabbar .cnt{position:absolute;top:2px;right:calc(50% - 22px);font-size:9.5px;font-weight:700;background:var(--pnb-gold-500);color:var(--pnb-navy-800);border-radius:99px;padding:0 5px;line-height:15px}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.more-grid button[aria-current="true"]{border-color:var(--pnb-gold-500);background:var(--pnb-gold-50)}
@media (max-width:900px){.demo-fab.over-pro{bottom:calc(80px + env(safe-area-inset-bottom,0px))}.pro-tabbar{display:grid}}
.list-i{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list-i:first-child{border-top:0}
.list-i .t{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);width:48px;flex:none}
.list-i .grow{flex:1;min-width:0}
.list-i .grow b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-i .grow span{font-size:12.5px;color:var(--ink-3)}

/* Agenda */
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;min-width:760px;position:relative}
.cal .hd{position:sticky;top:0;background:var(--surface-2);padding:10px 8px;font-size:12.5px;font-weight:700;text-align:center;border-left:1px solid var(--line)}
.cal .hd.today{color:var(--pnb-gold-700)}
.cal .hd small{display:block;font-size:20px;font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums}
.cal .hd.today small{color:var(--pnb-gold-700);font-weight:600}
.cal .tcol{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:right;padding-right:6px}
.cal .col{position:relative;border-left:1px solid var(--line)}
.cal .hr{height:56px;border-top:1px solid var(--line)}
.cal .hr.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.25;cursor:pointer;overflow:hidden;border:1px solid;text-align:left}
.ev{display:flex;flex-direction:column;gap:3px}
.ev>*{flex-shrink:0}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.ev span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.ev em{font-style:normal;font-size:11.5px;line-height:1.3;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:1}
.ev i{font-style:normal;display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.ev u{text-decoration:none;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.75);color:var(--ink-2)}
.ev u.md-v{background:var(--pnb-navy-800);color:var(--pnb-gold-500)}
.cal .hr.vt{background:var(--pnb-info-50,#eef5fc)}
.ev.solicitada{background:var(--pnb-warning-100);border-color:#f2c79c;color:var(--ink)}
.ev.confirmada{background:var(--pnb-info-100);border-color:#b5cdea;color:var(--ink)}
.ev.completada{background:var(--pnb-success-100);border-color:#a9dcc6;color:var(--ink)}
.ev.cancelada{background:var(--surface-2);border-color:var(--line);color:var(--ink-3);text-decoration:line-through}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.month .mh{background:var(--surface-2);padding:8px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.month .mc{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.month .mc:nth-child(7n+1){border-left:0}
.month .mc.out{opacity:.4}
.month .mc.today .dn{background:var(--pnb-gold-500);color:var(--pnb-navy-800)}
.month .dn{font-size:12.5px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.month .mini{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.month .mc{min-height:62px}.month .mini{font-size:0;height:6px;padding:0}}

/* Patient header */
.p-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.p-head .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.measure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mbox{background:var(--surface-2);border-radius:16px;padding:14px}
.mbox .l{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.mbox .v{font-size:26px;font-weight:300;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--pnb-navy-800)}
.mbox .v small{font-family:var(--f-body);font-size:12px;color:var(--ink-3);margin-left:3px}
.mbox .d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.fieldset{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fieldset>legend{font-weight:750;font-size:13px;padding:0 6px;color:var(--ink)}

/* Charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Photos */
.photo{border-radius:12px;overflow:hidden;background:var(--surface-2);position:relative;aspect-ratio:3/4}
.photo svg,.photo img{width:100%;height:100%;display:block;object-fit:cover}
.photo .cap{position:absolute;left:8px;bottom:8px;right:8px;background:rgba(10,20,16,.72);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:7px;display:flex;justify-content:space-between;gap:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cmp{position:relative;aspect-ratio:3/4;max-width:420px;width:100%;border-radius:24px;overflow:hidden;background:var(--surface-2);margin:0 auto}
.cmp>div{position:absolute;inset:0}
.cmp svg,.cmp img{width:100%;height:100%;display:block;object-fit:cover}
.cmp .after{clip-path:inset(0 0 0 var(--cut,50%))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--pnb-gold-500);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.cmp .lbl{position:absolute;top:10px;font-size:11.5px;font-weight:700;background:rgba(10,20,16,.7);color:#fff;padding:3px 8px;border-radius:6px}
input[type=range]{accent-color:var(--pnb-gold-500);width:100%}

/* Plan builder */
.builder{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.builder{grid-template-columns:minmax(0,1fr)}}
.sec-nav{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
@media (max-width:1000px){.sec-nav{position:static;flex-direction:row;flex-wrap:wrap}}
.sec-nav label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px;cursor:pointer}
.sec-nav label:hover{background:var(--surface-2)}
.sec-nav input,.check-grid input,input[type=checkbox]{accent-color:var(--pnb-gold-600)}
.sec{scroll-margin-top:120px}
.sec.off{opacity:.45}
.sec .num-tag{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.meal{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.meal-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.irow{display:grid;grid-template-columns:minmax(0,2.2fr) 70px minmax(0,1.6fr) 32px;gap:6px;align-items:center}
.irow.h{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:620px){.irow{grid-template-columns:minmax(0,1fr) 64px 32px}.irow .obs{grid-column:1/-1}.irow.h{display:none}}
.xrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 32px;gap:6px;align-items:center}
@media (max-width:760px){.xrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.exrow{display:grid;grid-template-columns:minmax(0,2fr) 60px 70px 60px minmax(0,1.4fr) 32px;gap:6px;align-items:center}
@media (max-width:760px){.exrow{grid-template-columns:minmax(0,1fr) 60px 60px 32px}.exrow .hide-sm{display:none}}
.del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:16px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px}
.check-grid label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.check-grid input{accent-color:var(--pine)}
.ver{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ver:first-child{border-top:0}
.ver .vn{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);border-radius:7px;padding:2px 8px;font-size:12.5px}

/* Document preview (paper) */
.paper{background:#fff;color:#3b4d66;font-family:var(--f-body);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.15);padding:34px 38px;font-size:12.5px;line-height:1.5;max-width:780px;margin:0 auto;color-scheme:light}
.paper .pp-h{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #c9a227;padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap}
.paper .pp-brand{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#0d1b33}
.paper .pp-sub{font-size:11.5px;color:#5a6b84}

.paper h2{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#0d1b33;margin:4px 0 2px}
.paper h4{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a6d0f;margin:18px 0 6px;font-weight:800}
.paper table{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0}
.paper th{background:#0d1b33;color:#fff;text-align:left;padding:5px 7px;font-weight:700}

"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = iso(new Date());
const addD = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return iso(d); };
const dt = s => new Date(s + "T12:00");
const dow = s => dt(s).getDay();
const fmtD = s => s ? dt(s).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" }) : "—";
const fmtDS = s => s ? dt(s).toLocaleDateString("es-CO", { day: "numeric", month: "short" }) : "—";

/* ---------- gráficos SVG ---------- */
function lineChart(series, { h = 220, unit = "", band = null } = {}) {
  const pts = series.flatMap(s => s.pts);
  if (pts.length < 1) return `<div class="empty"><b>Sin datos todavía</b><span>Registra una consulta con mediciones para ver la evolución.</span></div>`;
  const W = 640, H = h, L = 44, R = 16, T = 14, B = 28;
  const xs = [...new Set(pts.map(p => p.x))].sort();
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo, step = niceStep(span / 4); lo = Math.floor((lo - span * .08) / step) * step; hi = Math.ceil((hi + span * .08) / step) * step;
  const X = x => xs.length === 1 ? (L + (W - L - R) / 2) : L + (xs.indexOf(x) / (xs.length - 1)) * (W - L - R);
  const Y = y => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${n1(+v.toFixed(2))}</text>`;
  const every = Math.ceil(xs.length / 6);
  xs.forEach((x, i) => { if (i % every === 0 || i === xs.length - 1) g += `<text class="ax" x="${X(x)}" y="${H - 8}" text-anchor="middle">${esc(fmtDS(x))}</text>`; });
  series.forEach(s => {
    const p = s.pts.slice().sort((a, b) => a.x.localeCompare(b.x)); if (!p.length) return;
    const d = p.map((q, i) => `${i ? "L" : "M"}${X(q.x).toFixed(1)},${Y(q.y).toFixed(1)}`).join("");
    if (series.length === 1) g += `<path d="${d}L${X(p[p.length - 1].x)},${H - B}L${X(p[0].x)},${H - B}Z" fill="${s.color}" opacity=".10"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    p.forEach((q, i) => { const last = i === p.length - 1; g += `<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="${last ? 5 : 3.2}" fill="${last ? s.color : "var(--surface)"}" stroke="${s.color}" stroke-width="2"><title>${esc(fmtD(q.x))}: ${n1(q.y)} ${esc(unit)}</title></circle>`; });
    const lq = p[p.length - 1]; g += `<text x="${Math.min(X(lq.x), W - R - 4)}" y="${Y(lq.y) - 10}" text-anchor="end" style="fill:var(--ink);font:600 12px var(--f-mono)">${n1(lq.y)}</text>`;
  });
  const leg = series.length > 1 ? `<div class="legend" style="margin-top:6px">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(", "))}">${g}</svg>${leg}</div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function ring(pct, size = 96, label = "") {
  const r = size / 2 - 9, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(v * 100)}%"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="9"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--saffron)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c * v} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="fill:var(--ink);font:300 ${size / 4.4}px var(--f-body)">${Math.round(v * 100)}%</text>${label ? `` : ""}</svg>`;
}
function bars(items, { h = 150, color = "var(--pine)", max = 100, unit = "%" } = {}) {
  if (!items.length) return `<div class="empty"><b>Sin registros</b></div>`;
  const W = 640, B = 26, T = 18, bw = Math.min(56, (W - 20) / items.length - 12);
  const step = (W - 20) / items.length;

  items.forEach((it, i) => { const x = 10 + i * step + (step - bw) / 2, bh = (it.v / max) * (h - B - T); g += `<rect x="${x}" y="${h - B - bh}" width="${bw}" height="${bh}" rx="6" fill="${color}"><title>${esc(it.l)}: ${it.v}${unit}</title></rect><text x="${x + bw / 2}" y="${h - B - bh - 5}" text-anchor="middle" style="fill:var(--ink);font:600 11px var(--f-mono)">${it.v}${unit}</text><text class="ax" x="${x + bw / 2}" y="${h - 8}" text-anchor="middle">${esc(it.l)}</text>`; });

ACT.bkSubmit = () => {
  const f = $("#bkForm"), v = formData(f), err = [];

  if (!/^\S+@\S+\.\S+$/.test(v.email || "")) err.push("Revisa el correo.");

    <div class="card"><div class="kpi"><span class="l">Pacientes activos</span><span class="v">${act}</span><span class="s">${pubCount} planes publicados · adherencia media ${adhAvg}%</span></div></div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);margin-top:16px" id="dashGrid">
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Agenda de hoy</h3><button class="btn sm quiet" data-act="go" data-r="pro-agenda">Abrir agenda →</button></div>
      ${today.length ? today.map(a => apptRow(a)).join("") : `<div class="empty"><b>Sin citas para hoy</b><span>Las reservas del sitio público aparecerán aquí.</span></div>`}</div>

      ${fu.length ? fu.map(w => { const p = pat(w.pid); return `<div class="list-i">${avatar(p)}<div class="grow"><b>${esc(p.name)}</b><span>Semana del ${fmtDS(w.week)} · adherencia ${w.adherence}%</span></div><button class="btn sm line" data-act="reviewWeek" data-id="${w.id}">Revisar</button></div>`; }).join("") : `<div class="empty"><b>Al día</b><span>No hay seguimientos semanales sin revisar.</span></div>`}
      ${S.labs.filter(l => l.status === "revision").map(l => `<div class="list-i"><span class="avatar" style="background:var(--sky-soft);color:var(--sky)">Lab</span><div class="grow"><b>${esc(l.type)}</b><span>${esc(pat(l.pid).name)} · ${fmtDS(l.date)}</span></div><button class="btn sm line" data-act="openLab" data-id="${l.id}">Revisar</button></div>`).join("")}</div>

function apptRow(a, withDate) {

/* Agenda */
function vAgenda() {
  const V = UI.agView, D = UI.agDate;
  let title = "", body = "";
  if (V === "semana") {
    const ws = weekStart(D), days = [0, 1, 2, 3, 4, 5].map(i => addD(ws, i));
    title = `${fmtDS(days[0])} – ${fmtD(days[5])}`;
    const H0 = 7, H1 = 18, ph = 96;
    const n = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    body = `<div class="cal-wrap"><div class="cal" style="grid-template-columns:56px repeat(6,minmax(110px,1fr))">
      <div class="hd" style="border-left:0"></div>${days.map(d => `<div class="hd ${d === TODAY ? "today" : ""}">${n[dow(d)]}<small>${dt(d).getDate()}</small></div>`).join("")}
      <div>${Array.from({ length: H1 - H0 }, (_, i) => `<div class="hr tcol" style="border-top:1px solid var(--line);height:96px">${pad(H0 + i)}:00</div>`).join("")}</div>
      ${days.map(d => { const hs = ["Presencial", "Virtual"].map(m => winFor(d, m)).filter(Boolean); const evs = S.appts.filter(a => a.date === d);
        return `<div class="col">${Array.from({ length: H1 - H0 }, (_, i) => { const m = (H0 + i) * 60; const inP = (w => w && m >= toMin(w[0]) && m < toMin(w[1]))(winFor(d, "Presencial")), inV = (w => w && m >= toMin(w[0]) && m < toMin(w[1]))(winFor(d, "Virtual")); const off = !inP && !inV; return `<div class="hr ${off ? "off" : inV && !inP ? "vt" : ""}" style="height:96px" data-act="slotClick" data-d="${d}" data-t="${pad(H0 + i)}:00"></div>`; }).join("")}
        ${evs.map(a => { const top = (toMin(a.time) - H0 * 60) / 60 * ph, hh = Math.max(26, svc(a.sid).dur / 60 * ph - 3); const sv = svc(a.sid), p = pat(a.pid); return `<button class="ev ${a.status}" style="top:${top + 1}px;height:${hh}px;${UI.flash === a.id ? "box-shadow:0 0 0 3px var(--saffron);" : ""}" data-act="openAppt" data-id="${a.id}" title="${esc(`${p.name} · ${a.time}–${toHM(apptEnd(a))} · ${sv.name} · ${a.mode} · ${a.status}${a.source === "web" ? " · reserva web" : ""}`)}"><b>${esc(p.name)}</b><i><span>${a.time}–${toHM(apptEnd(a))}</span><u class="${a.mode === "Virtual" ? "md-v" : "md-p"}">${a.mode === "Virtual" ? "Virtual" : "Pres."}</u></i><em style="-webkit-line-clamp:${hh > 80 ? 2 : 1}">${esc(sv.name)}</em></button>`; }).join("")}</div>`; }).join("")}
    </div></div>`;
  } else if (V === "dia") {
    title = cap(fmtDL(D));
    const evs = S.appts.filter(a => a.date === D).sort((a, b) => a.time.localeCompare(b.time));
    body = `<div class="card">${evs.length ? evs.map(a => apptRow(a)).join("") : `<div class="empty"><b>Sin citas este día</b><button class="btn sm primary" data-act="newAppt" data-d="${D}">Crear cita</button></div>`}</div>`;
  } else {
    const first = D.slice(0, 8) + "01"; title = cap(dt(first).toLocaleDateString("es-CO", { month: "long", year: "numeric" }));
    const start = weekStart(first); const cells = Array.from({ length: 42 }, (_, i) => addD(start, i));
    body = `<div class="month">${["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map(x => `<div class="mh">${x}</div>`).join("")}
    ${cells.map(c => { const evs = S.appts.filter(a => a.date === c).sort((a, b) => a.time.localeCompare(b.time)); return `<div class="mc ${c.slice(0, 7) !== first.slice(0, 7) ? "out" : ""} ${c === TODAY ? "today" : ""}" data-act="monthDay" data-d="${c}"><span class="dn">${dt(c).getDate()}</span>${evs.slice(0, 3).map(a => `<span class="mini ev ${a.status}" style="position:static;border-left-width:2px">${a.time} ${esc(pat(a.pid).name.split(" ")[0])}</span>`).join("")}${evs.length > 3 ? `<span class="faint" style="font-size:11px">+${evs.length - 3}</span>` : ""}</div>`; }).join("")}</div>`;
  }
  UI.flash = null;
  const stepN = V === "semana" ? 7 : V === "dia" ? 1 : 30;
  const counts = ["solicitada", "confirmada", "completada", "cancelada"].map(s => `<span class="chip st-${s}">${cap(s)} ${S.appts.filter(a => a.status === s).length}</span>`).join("");
  return pageH("Agenda", "Toca una cita para ver su detalle completo. Blanco: presencial · azul claro: solo virtual · rayado: sin atención.", `<button class="btn primary" data-act="newAppt">Nueva cita</button>`) + `
  <div class="row between" style="margin-bottom:14px">
    <div class="row"><button class="btn sm line" data-act="agNav" data-n="-${stepN}">‹</button><button class="btn sm line" data-act="agToday">Hoy</button><button class="btn sm line" data-act="agNav" data-n="${stepN}">›</button><b style="font-size:16px">${title}</b></div>
    <div class="pills">${[["dia", "Día"], ["semana", "Semana"], ["mes", "Mes"]].map(([k, l]) => `<button aria-pressed="${V === k}" data-act="agView" data-v="${k}">${l}</button>`).join("")}</div>
  </div>${body}<div class="row" style="margin-top:12px">${counts}</div>`;
}

ACT.genDoc = d => {

  else m = buildConDoc(d.id);
  S.seq.doc++;
  const same = S.docs.filter(x => x.pid === m.pid && x.kind === m.kind).length + 1;
  m.code = `${KIND[m.kind][1]}-${pad(S.seq.doc).padStart(4, "0")}`; m.docVer = "Edición " + same; m.ts = new Date().toISOString();
  if (!m.version) m.version = "Edición " + same;
  const rec = { id: uid("d"), pid: m.pid, kind: m.kind, code: m.code, title: KIND[m.kind][0], date: TODAY, ts: m.ts, version: m.version, model: m };
  S.docs.push(rec); closeModal(true);
  commit(`${KIND[m.kind][0]} ${m.code} generado para ${pat(m.pid).name}`, "doc");

};
ACT.openDoc = d => openDocModal(S.docs.find(x => x.id === d.id));

function docRow(x) { return `<div class="list-i"><span class="avatar" style="background:var(--surface-2);color:var(--ink-2);font-size:10px">PDF</span><div class="grow"><b>${esc(x.title)} · ${esc(pat(x.pid)?.name || "")}</b><span class="mono">${esc(x.code)} · ${esc(x.version)} · ${fmtD(x.date)}</span></div><button class="btn xs line" data-act="openDoc" data-id="${x.id}">Abrir</button></div>`; }
function vDocs() {
  const p = pat(UI.sel) || S.patients[0], cs = consultsOf(p.id), pl = pubPlan(p.id);

CHANGES.docPid = el => { UI.sel = el.value; render(); };
ACT.genPlanSel = () => ACT.genDoc({ k: "plan", id: $("#docPlanV").value });
ACT.genConSel = () => ACT.genDoc({ k: "consulta", id: $("#docCon").value });

function docHtml(m) {
  const D = S.doctor;
  const blk = b => {
    if (b.t === "h") return `<h4>${esc(b.x)}</h4>`;
    if (b.t === "p") return `<p style="margin:4px 0">${esc(b.x)}</p>`;
    if (b.t === "note") return `<p style="margin:10px 0 0;font-size:10.5px;color:#5a6b84">${esc(b.x)}</p>`;
    if (b.t === "list") return `<ul>${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
    if (b.t === "kv") return `<div class="kv">${b.rows.map(r => `<div><span>${esc(r[0])}</span><b style="text-align:right">${esc(r[1])}</b></div>`).join("")}</div>`;
    if (b.t === "table") return `<div style="overflow-x:auto"><table><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td style="white-space:pre-line">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if (b.t === "chart") return `<h4>${esc(b.title)}</h4><div style="--surface:#fff;--line:#e8ecf2;--ink:#0d1b33;--ink-3:#5a6b84;--ink-2:#3b4d66">${lineChart(b.series, { h: 170 })}</div>`;
    return "";
  };
  return `<article class="paper"><div class="pp-h"><div><div class="pp-brand">${esc(D.name)}</div><div class="pp-sub">${esc(D.title)} · ${esc(D.specialty)} · ${esc(D.city)}</div></div><div class="pp-meta">${esc(m.code || "VISTA PREVIA")}<br>${esc(m.version || "")}<br>Emitido ${fmtD(m.date)}</div></div>
  <div class="pp-demo">DOCUMENTO DEMOSTRATIVO · DATOS FICTICIOS · No válido como historia clínica ni como indicación médica real.</div>
  <h2>${esc(m.title)}</h2><div class="pp-sub" style="margin-bottom:8px">${esc(m.subtitle || "")}</div>${m.blocks.map(blk).join("")}
  <div class="pp-foot"><span>${esc(D.reg)} · ${esc(D.email)}</span><span style="display:flex;align-items:center;gap:8px">Solución a la medida · IA y tecnologías emergentes <span style="display:block;width:64px">${PNB_LOGO_COLOR}</span></span></div></article>`;
}
const pdfTxt = s => String(s ?? "").replace(/[−–—]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, "...").replace(/²/g, "2").replace(/[^\x00-\xFF]/g, "");
function pdfFromModel(m) {
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "pt", format: "a4" });
  const W = 595.28, H = 841.89, M = 42, D = S.doctor, PINE = [13, 27, 51], GOLD = [201, 162, 39], GOLD7 = [138, 109, 15], INK = [13, 27, 51], BODY = [59, 77, 102], MUT = [90, 107, 132];
  let y = 0;
  const header = first => {
    doc.setFillColor(...PINE); doc.rect(0, 0, W, first ? 78 : 34, "F");
    doc.setTextColor(255, 255, 255);
    if (first) {
      doc.setFillColor(...GOLD); doc.rect(0, 78, W, 3, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text(pdfTxt(D.name), M, 34);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(185, 198, 218); doc.text(pdfTxt(`${D.title} · ${D.specialty} · ${D.city}`), M, 50); doc.setTextColor(...GOLD);
      doc.setFont("courier", "normal"); doc.setFontSize(8.5); doc.text(pdfTxt(m.code || ""), W - M, 30, { align: "right" }); doc.text(pdfTxt(m.version || ""), W - M, 42, { align: "right" }); doc.text(pdfTxt("Emitido " + fmtD(m.date)), W - M, 54, { align: "right" });
      doc.setFillColor(248, 239, 204); doc.roundedRect(M, 94, W - 2 * M, 18, 4, 4, "F"); doc.setTextColor(107, 84, 11); doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
      doc.text("DOCUMENTO DEMOSTRATIVO · DATOS FICTICIOS · No válido como historia clínica ni como indicación médica real.", M + 8, 106);
      doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(21); doc.text(pdfTxt(m.title), M, 142);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...MUT); doc.text(pdfTxt(m.subtitle || ""), M, 156); y = 172;
    } else { doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.text(pdfTxt(`${D.name} · ${m.title}`), M, 21); doc.setFont("courier", "normal"); doc.text(pdfTxt(m.code || ""), W - M, 21, { align: "right" }); y = 56; }
  };
  const need = h => { if (y + h > H - 50) { doc.addPage(); y = 56; } };
  const at = (opts) => { doc.autoTable({ margin: { left: M, right: M, top: 50 }, startY: y, styles: { font: "helvetica", fontSize: 8.5, cellPadding: 4, textColor: BODY, lineColor: [232, 236, 242], lineWidth: 0.5, overflow: "linebreak" }, headStyles: { fillColor: PINE, textColor: 255, fontStyle: "bold" }, alternateRowStyles: { fillColor: [241, 244, 248] }, ...opts }); y = doc.lastAutoTable.finalY + 10; };
  header(true);
  m.blocks.forEach(b => {
    if (b.t === "h") { need(40); y += 8; doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setCharSpace(0.8); doc.setTextColor(...GOLD7); doc.text(pdfTxt(b.x.toUpperCase()), M, y); doc.setCharSpace(0); doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.line(M, y + 4, W - M, y + 4); y += 16; }
    else if (b.t === "p" || b.t === "note") { doc.setFont("helvetica", b.t === "note" ? "italic" : "normal"); doc.setFontSize(b.t === "note" ? 8 : 9.5); doc.setTextColor(...(b.t === "note" ? MUT : BODY)); const ls = doc.splitTextToSize(pdfTxt(b.x), W - 2 * M); need(ls.length * 12 + 4); doc.text(ls, M, y + 8); y += ls.length * 12 + 6; }
    else if (b.t === "list") { doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...BODY); b.items.forEach(it => { const ls = doc.splitTextToSize(pdfTxt(it), W - 2 * M - 14); need(ls.length * 12 + 2); doc.setFillColor(...GOLD); doc.circle(M + 3, y + 5, 1.6, "F"); doc.text(ls, M + 12, y + 8); y += ls.length * 12 + 2; }); y += 4; }
    else if (b.t === "kv") { const rows = []; for (let i = 0; i < b.rows.length; i += 2) { const a = b.rows[i], c = b.rows[i + 1] || ["", ""]; rows.push([a[0], a[1], c[0], c[1]].map(pdfTxt)); } at({ body: rows, theme: "plain", styles: { font: "helvetica", fontSize: 8.5, cellPadding: 3, textColor: INK }, columnStyles: { 0: { textColor: MUT, cellWidth: 90 }, 1: { fontStyle: "bold" }, 2: { textColor: MUT, cellWidth: 90 }, 3: { fontStyle: "bold" } } }); }
    else if (b.t === "table") at({ head: [b.head.map(pdfTxt)], body: b.rows.map(r => r.map(pdfTxt)) });

  return doc.output("blob");
}
function pdfChart(doc, b, x0, y0, w, h) {
  const pts = b.series.flatMap(s => s.pts); if (!pts.length) return;
  const xs = [...new Set(pts.map(p => p.x))].sort(); let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y)); if (lo === hi) { lo--; hi++; }
  const pd = (hi - lo) * .12; lo -= pd; hi += pd;
  const L = x0 + 34, R = x0 + w - 8, T = y0 + 22, Bm = y0 + h - 18;
  doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(13, 27, 51); doc.text(pdfTxt(b.title), x0, y0 + 10);
  const X = v => xs.length === 1 ? (L + R) / 2 : L + xs.indexOf(v) / (xs.length - 1) * (R - L), Y = v => Bm - (v - lo) / (hi - lo) * (Bm - T);
  doc.setDrawColor(232, 236, 242); doc.setLineWidth(0.4); doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(90, 107, 132);
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; doc.line(L, Y(v), R, Y(v)); doc.text(n1(+v.toFixed(1)).replace(/ /g, " "), L - 4, Y(v) + 2, { align: "right" }); }
  xs.forEach(x => doc.text(pdfTxt(fmtDS(x)), X(x), Bm + 11, { align: "center" }));
  let lx = R;
  b.series.forEach(s => {
    const c = s.color.match(/\w\w/g).map(h => parseInt(h, 16)); doc.setDrawColor(...c); doc.setFillColor(...c); doc.setLineWidth(1.6);
    const p = s.pts.slice().sort((a, q) => a.x.localeCompare(q.x));
    for (let i = 1; i < p.length; i++) doc.line(X(p[i - 1].x), Y(p[i - 1].y), X(p[i].x), Y(p[i].y));
    p.forEach(q => doc.circle(X(q.x), Y(q.y), 2.2, "F"));
    const lq = p[p.length - 1]; doc.setFontSize(7.5); doc.setTextColor(...c); doc.text(n1(lq.y), X(lq.x) - 4, Y(lq.y) - 5, { align: "right" });
    if (b.series.length > 1) { doc.setFontSize(7.5); const tw = doc.getTextWidth(pdfTxt(s.name)); lx -= tw + 16; doc.rect(lx, y0 + 4, 7, 7, "F"); doc.text(pdfTxt(s.name), lx + 10, y0 + 10.5); }
  });
}

/* ---------- arranque y delegación de eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  if (t.tagName === "A" && !t.dataset.act.startsWith("scroll") && t.dataset.act !== "bJump") e.preventDefault();
  f(t.dataset, t, e);
});
document.addEventListener("submit", e => { e.preventDefault(); const f = e.target, h = FORMS[f.dataset.form]; if (h) h(formData(f), f); });
document.addEventListener("input", e => { const k = e.target.dataset?.input; if (k && INPUTS[k]) INPUTS[k](e.target); });
document.addEventListener("change", e => { const k = e.target.dataset?.change; if (k && CHANGES[k]) CHANGES[k](e.target); });
render();
(async () => { try { if (window.claude && window.claude.use) { UI.dl = await window.claude.use("downloads"); } } catch (e) { UI.dl = null; } })();
